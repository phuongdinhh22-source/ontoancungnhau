<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bé tập tính – Cộng trừ trong phạm vi 10</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg1:#bfe9ff;--bg2:#fff6c9;--card:#ffffff;--ink:#27315a;--soft:#6a739c;
  --orange:#ff8a3d;--blue:#2f9bff;--pink:#ff5c9a;--green:#2fc46b;--yellow:#ffd23f;--red:#f2555a;
  --box:#fff0c2;--boxline:#ff8a3d;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg1:#1d2a55;--bg2:#3a2a5e;--card:#2a3566;--ink:#fff8e1;--soft:#c3cbf0;--box:#4a3f78;}
}
:root[data-theme="dark"]{--bg1:#1d2a55;--bg2:#3a2a5e;--card:#2a3566;--ink:#fff8e1;--soft:#c3cbf0;--box:#4a3f78;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{min-height:100%;font-family:"Baloo 2","Nunito","Segoe UI",system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(160deg,var(--bg1),var(--bg2));padding:16px;display:flex;justify-content:center}
.app{width:100%;max-width:640px}
h1{margin:0 0 10px;text-align:center;font-size:clamp(26px,6vw,36px);font-weight:800;color:var(--blue)}
.modes{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
.mode{font:inherit;font-weight:700;font-size:20px;padding:8px 18px;border-radius:999px;border:3px solid var(--blue);
  background:var(--card);color:var(--blue);cursor:pointer}
.mode[aria-pressed="true"]{background:var(--blue);color:#fff}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
.dot{width:18px;height:18px;border-radius:50%;background:var(--card);border:3px solid var(--yellow)}
.dot.now{background:var(--yellow)}
.dot.ok{background:var(--green);border-color:var(--green)}
.dot.miss{background:var(--pink);border-color:var(--pink)}
.card{background:var(--card);border-radius:32px;padding:20px 12px;box-shadow:0 8px 0 rgba(47,155,255,.25);text-align:center}
.eq{display:flex;align-items:center;justify-content:center;gap:clamp(6px,2.5vw,18px);
  font-size:clamp(64px,19vw,120px);font-weight:800;line-height:1;margin:6px 0 10px}
.num{color:var(--orange)}
.op{color:var(--pink)}
.eqs{color:var(--blue)}
.blank{min-width:1.05em;height:1.15em;border:6px dashed var(--boxline);border-radius:24px;background:var(--box);
  color:var(--green);display:inline-flex;align-items:center;justify-content:center}
.blank.right{border-style:solid;border-color:var(--green)}
.blank.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@media (prefers-reduced-motion:reduce){.blank.shake{animation:none}}
.msg{min-height:44px;font-size:26px;font-weight:700;margin:2px 0 8px}
.msg.good{color:var(--green)}.msg.bad{color:var(--red)}
.pad{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:6px}
.key{font:inherit;font-weight:800;font-size:clamp(34px,9vw,52px);line-height:1;padding:10px 0;border:0;border-radius:20px;
  color:#fff;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.key:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.key:disabled{opacity:.45;cursor:default}
.key:nth-child(5n+1){background:var(--orange)}.key:nth-child(5n+2){background:var(--blue)}
.key:nth-child(5n+3){background:var(--pink)}.key:nth-child(5n+4){background:var(--green)}
.key:nth-child(5n+5){background:#a56cf2}
.key:focus-visible,.btn:focus-visible,.mode:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.row{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;font-size:24px;padding:10px 24px;border:0;border-radius:999px;cursor:pointer;
  color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.hint{background:var(--yellow);color:#4a3600}
.next{background:var(--green)}
.hintbox{margin-top:12px;font-size:20px;color:var(--soft);font-weight:500}
.balls{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.ball{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:800;color:#fff}
.ball.k{background:var(--orange)}.ball.k2{background:var(--blue)}
.ball.u{background:transparent;border:4px dashed var(--boxline)}
.ball.x{background:#c9cde0;color:#8a90ad}
.result{padding:20px 8px}
.result .big{font-size:clamp(60px,18vw,110px)}
.result p{font-size:26px;margin:6px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="app">
  <h1>Bé tập tính</h1>
  <div class="modes" role="group" aria-label="Chọn dạng bài">
    <button class="mode" data-m="add" aria-pressed="false">Cộng</button>
    <button class="mode" data-m="sub" aria-pressed="false">Trừ</button>
    <button class="mode" data-m="mix" aria-pressed="true">Cả hai</button>
  </div>
  <div class="dots" id="dots" aria-label="Tiến độ"></div>

  <section class="card" id="play">
    <div class="eq" id="eq" aria-live="polite"></div>
    <div class="msg" id="msg"></div>
    <div class="pad" id="pad"></div>
    <div class="row">
      <button class="btn hint" id="hintBtn">💡 Gợi ý</button>
      <button class="btn next" id="nextBtn" hidden>Câu tiếp ➜</button>
    </div>
    <div class="hintbox" id="hintBox" hidden></div>
  </section>

  <section class="card result" id="end" hidden>
    <div class="big" id="stars"></div>
    <p id="endMsg"></p>
    <div class="row"><button class="btn next" id="again">Chơi lại</button></div>
  </section>
</main>

<script>
(function(){
  var TOTAL=10, mode='mix', idx=0, q=null, firstTry=true, done=false, score=0, results=[], last='';
  var $=function(id){return document.getElementById(id)};
  var eq=$('eq'),msg=$('msg'),pad=$('pad'),dots=$('dots'),hintBox=$('hintBox'),nextBtn=$('nextBtn');

  function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}

  // Tạo câu hỏi. Mọi số đều từ 0..10, phép trừ không âm.
  function make(){
    var op = mode==='mix' ? (Math.random()<.5?'+':'-') : (mode==='add'?'+':'-');
    var a,b,c;
    if(op==='+'){ a=rnd(1,9); b=rnd(1,10-a); c=a+b; }
    else { a=rnd(2,10); b=rnd(1,a-1); c=a-b; }
    var blank=['a','b','c'][rnd(0,2)];
    var key=op+a+b+blank;
    if(key===last) return make();
    last=key;
    return {op:op,a:a,b:b,c:c,blank:blank,ans:{a:a,b:b,c:c}[blank]};
  }

  function renderDots(){
    dots.innerHTML='';
    for(var i=0;i<TOTAL;i++){
      var d=document.createElement('span');
      d.className='dot'+(i<results.length?(results[i]?' ok':' miss'):(i===idx?' now':''));
      dots.appendChild(d);
    }
  }

  function cell(v,k){
    if(q.blank===k) return '<span class="blank" id="blank">?</span>';
    return '<span class="num">'+v+'</span>';
  }

  function show(){
    q=make(); firstTry=true; done=false;
    eq.innerHTML=cell(q.a,'a')+'<span class="op">'+(q.op==='+'?'+':'−')+'</span>'+cell(q.b,'b')+
      '<span class="eqs">=</span>'+cell(q.c,'c');
    msg.textContent='Chọn số thích hợp thay cho dấu ?'; msg.className='msg';
    nextBtn.hidden=true; hintBox.hidden=true; $('hintBtn').hidden=false;
    [].forEach.call(pad.children,function(b){b.disabled=false});
    renderDots();
  }

  function balls(n,cls,txt){
    var s='';
    for(var i=0;i<n;i++) s+='<span class="ball '+cls+'">'+(txt||'')+'</span>';
    return s;
  }

  function hint(){
    var h='';
    if(q.op==='+'){
      // hai nhóm gộp lại thành tổng
      var A=q.blank==='a'?balls(q.a,'u'):balls(q.a,'k');
      var B=q.blank==='b'?balls(q.b,'u'):balls(q.b,'k2');
      if(q.blank==='c'){
        h='Đếm tất cả các hình tròn nhé:<div class="balls">'+balls(q.a,'k')+balls(q.b,'k2')+'</div>';
      } else {
        h='Có tất cả '+q.c+' hình tròn. Đếm các hình nét đứt nhé:<div class="balls">'+A+B+'</div>';
      }
    } else {
      // a hình tròn, bớt b hình, còn c hình
      if(q.blank==='c'){
        h='Có '+q.a+' hình, bớt '+q.b+' hình. Đếm các hình còn lại nhé:<div class="balls">'+balls(q.c,'u')+balls(q.b,'x','✕')+'</div>';
      } else if(q.blank==='b'){
        h='Có '+q.a+' hình, còn lại '+q.c+' hình. Đếm các hình bị bớt đi nhé:<div class="balls">'+balls(q.c,'k')+balls(q.b,'u')+'</div>';
      } else {
        h='Bớt '+q.b+' hình thì còn '+q.c+' hình. Đếm tất cả các hình lúc đầu nhé:<div class="balls">'+balls(q.c,'k')+balls(q.b,'x','✕')+'</div>';
      }
    }
    hintBox.innerHTML=h; hintBox.hidden=false;
  }

  function pick(n){
    if(done) return;
    var bl=$('blank');
    if(n===q.ans){
      done=true;
      bl.textContent=n; bl.classList.add('right');
      msg.textContent=firstTry?'Giỏi quá! Đúng rồi! ⭐':'Đúng rồi! Bé làm được rồi! 👍'; msg.className='msg good';
      if(firstTry) score++;
      results.push(firstTry);
      renderDots();
      [].forEach.call(pad.children,function(b){b.disabled=true});
      $('hintBtn').hidden=true;
      nextBtn.textContent = results.length>=TOTAL ? 'Xem kết quả ➜' : 'Câu tiếp ➜';
      nextBtn.hidden=false; nextBtn.focus();
    } else {
      firstTry=false;
      bl.classList.remove('shake'); void bl.offsetWidth; bl.classList.add('shake');
      msg.textContent='Chưa đúng, bé thử lại nhé! 💪'; msg.className='msg bad';
    }
  }

  function next(){
    idx++;
    if(idx>=TOTAL){ finish(); } else show();
  }

  function finish(){
    $('play').hidden=true; $('end').hidden=false;
    var st=score>=9?3:score>=6?2:1;
    $('stars').textContent=new Array(st+1).join('⭐');
    $('endMsg').textContent='Bé đúng ngay lần đầu '+score+'/'+TOTAL+' câu.';
    renderDots();
  }

  function start(){
    idx=0; score=0; results=[]; last='';
    $('play').hidden=false; $('end').hidden=true; show();
  }

  for(var i=0;i<=10;i++){
    (function(n){
      var b=document.createElement('button');
      b.className='key'; b.textContent=n; b.setAttribute('aria-label','Số '+n);
      b.addEventListener('click',function(){pick(n)});
      pad.appendChild(b);
    })(i);
  }
  $('hintBtn').addEventListener('click',hint);
  nextBtn.addEventListener('click',next);
  $('again').addEventListener('click',start);
  [].forEach.call(document.querySelectorAll('.mode'),function(m){
    m.addEventListener('click',function(){
      mode=m.getAttribute('data-m');
      [].forEach.call(document.querySelectorAll('.mode'),function(x){x.setAttribute('aria-pressed',x===m?'true':'false')});
      start();
    });
  });
  start();
})();
</script>
</body>
</html>
